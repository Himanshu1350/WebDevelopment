<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERSCRIPT TAG</title>
</head>
<body>
    <p>This is a <sup>superscript</sup> paragraph.</p> 
    <p>H<sub>2</sub>O is the chemical formula for water.</p>
    <p>E = mc<sup>2</sup> is Einstein's famous equation.</p>
    <p>The area of a circle is A = πr<sup>2</sup>.</p>
    <p>In mathematics, x<sup>n</sup> represents x raised to the power of n.</p>    
</body>
</html>
