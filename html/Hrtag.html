    <title>HR TAG</title>

<body>
    <h1>HR TAG</h1> 
    <hr>
    <p>HR stands for Horizontal Rule. It is used to create a thematic break in an HTML page, typically represented as a horizontal line. The <hr> tag is a self-closing tag, meaning it does not require a closing tag. It is often used to separate content or sections within a webpage.</p>  
</body>
